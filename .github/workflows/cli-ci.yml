name: hedy CI

on:
  push:
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # hedy's baseline is Node >= 24 (cli/package.json engines).
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test
        env:
          CI: 'true'
